{Scores - Shared} $shared$ %Shared/shared% [
<h1>Shared Scores List</h1>
<div id="buttons">
  <div id="horizontal-buttons">
    <button type="button" class="btn btn-primary" id="shared"><i class="fas fa-share"></i>&NonBreakingSpace;Share
      Link</button>
  </div>
</div>
<div class="position-fixed top-10 start-50 translate-middle-x p-3" style="z-index: 11">
  <div id="myToast" class="toast hide  text-bg-primary" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Share Scores</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      A link to your score list has been copied to the clipboard.
    </div>
  </div>
  <div id="errorToast" class="toast hide text-bg-warning" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Share Scores</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      Failed to copy to clipboard
    </div>
  </div>
</div>


<section id="scores"></section>
]
